<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wolf Tone: uncover a vanished master’s mystery by rebuilding impossible instruments." />
    <title>Wolf Tone — Play</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">𝄢</span>
        <span>
          <strong>WOLF TONE</strong>
        </span>
      </div>
      <div class="level-switcher">
        <button id="prev-level" class="level-arrow" type="button" aria-label="Previous level">‹</button>
        <nav id="level-nav" class="level-nav" aria-label="Levels"></nav>
        <button id="next-level" class="level-arrow" type="button" aria-label="Next level">›</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden role="status" aria-live="polite">
      <span id="banner-icon" class="banner-icon"></span>
      <div class="banner-text">
        <strong id="banner-title"></strong>
        <p id="banner-detail"></p>
      </div>
      <button id="banner-next" type="button" hidden>Next level →</button>
      <button id="banner-close" type="button" aria-label="Close">×</button>
    </div>

    <main class="app-shell">
      <aside class="side-panel">
        <div id="assignment" class="assignment"></div>

        <section id="walkthrough-panel" class="walkthrough" data-region="walkthrough" aria-label="Walkthrough">
          <div class="deck-heading">
            <span>WALKTHROUGH</span>
            <button id="deck-toggle" type="button">hide</button>
          </div>
          <div id="deck-body">
            <div id="deck-step"></div>
            <div class="deck-nav">
              <button id="deck-prev" type="button">‹ back</button>
              <span id="deck-counter"></span>
              <button id="deck-next" type="button">next ›</button>
            </div>
            <button id="deck-reference" type="button" hidden>Place the reference build</button>
          </div>
        </section>

        <section class="commission" data-region="commission" aria-label="The commission">
          <div class="commission-heading">
            <span>THE COMMISSION</span>
            <button id="run-all" type="button">Run all</button>
          </div>
          <div id="case-tabs" class="case-tabs"></div>
          <div class="score-readout" aria-label="Score; lower is better">
            <span class="score-hint">LOWER IS BETTER</span>
            <span class="score-measure"><small>PARTS</small><output id="score-parts">0</output></span>
            <span class="score-measure"><small>WIRE</small><output id="score-wire">0</output></span>
            <span class="score-measure"><small>TIME</small><output id="score-time">—</output></span>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <div class="construction-bar" data-region="palette">
          <span class="bar-label">PARTS</span>
          <div id="palette" class="palette"></div>
          <span id="construction-help" class="construction-help"></span>
        </div>

        <div class="board-shell" data-region="board">
          <div class="board-zoom">
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <button id="zoom-fit" type="button">fit</button>
          </div>
          <div id="board-scroll" class="board-scroll">
            <svg id="board" role="img" aria-label="Wolf Tone board"></svg>
          </div>
        </div>

        <div class="transport" data-region="transport">
          <div class="transport-primary">
            <button id="run-button" class="run-button" type="button">▶ Run</button>
            <button id="step-button" type="button">Step</button>
            <button id="reset-run" type="button">Reset run</button>
          </div>
          <div class="tick-readout">
            <small>TICK</small>
            <output id="tick-output">–</output>
            <small id="run-status">READY</small>
          </div>
          <div class="transport-secondary">
            <span class="bar-label">SPEED</span>
            <button data-speed="0" type="button">1</button>
            <button data-speed="1" type="button" class="active">2</button>
            <button data-speed="2" type="button">3</button>
            <span class="transport-divider" aria-hidden="true"></span>
            <button id="undo-edit" type="button" title="Undo edit (Ctrl/Cmd+Z)" disabled>Undo</button>
            <button id="redo-edit" type="button" title="Redo edit (Ctrl/Cmd+Shift+Z)" disabled>Redo</button>
            <button id="mute-button" type="button" aria-label="Toggle machine sounds">♪ on</button>
            <button id="music-button" type="button" aria-label="Toggle soundtrack">♫ on</button>
            <button id="clear-machine" class="danger" type="button">Clear machine</button>
          </div>
        </div>

        <div class="lower-panels">
          <section class="inspector-panel" data-region="inspector">
            <div class="panel-heading"><span>INSPECTOR</span><span id="selection-kind">BOARD</span></div>
            <div id="inspector"></div>
            <details class="trace-panel">
              <summary>RUN TRACE <span id="trace-count">0 events</span></summary>
              <ul id="event-log" class="event-log"></ul>
            </details>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="./main.mjs"></script>
  </body>
</html>
