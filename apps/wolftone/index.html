<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wolf Tone is a machine-building puzzle game about routing and transforming strings of notes." />
    <title>Wolf Tone: Play</title>
    <link rel="stylesheet" href="./style.css?v=0.8.8-1" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e0b952c3-2a28-4575-9603-386229d51c15"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="brand">
        <strong>WOLF TONE</strong>
        <small>v0.8.8 · prototype</small>
        <small id="session-mode-label" class="session-mode-label" hidden></small>
      </div>
      <div class="level-switcher">
        <button id="prev-level" class="level-arrow" type="button" aria-label="Previous level">‹</button>
        <div class="level-menu">
          <button id="level-menu-toggle" class="level-menu-toggle" type="button" aria-controls="level-nav" aria-expanded="false">
            <span id="current-level-label">Current level</span>
          </button>
          <button id="level-menu-backdrop" class="level-menu-backdrop" type="button" aria-label="Close commissions" hidden></button>
          <nav id="level-nav" class="level-nav" aria-label="Levels" hidden></nav>
        </div>
        <button id="next-level" class="level-arrow" type="button" aria-label="Next level">›</button>
      </div>
      <div class="masthead-actions" aria-label="Audio controls">
        <button id="mute-button" type="button" aria-label="Toggle machine sounds">♪ on</button>
        <button id="music-button" type="button" aria-label="Toggle soundtrack">♫ on</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden role="status" aria-live="polite">
      <span id="banner-icon" class="banner-icon"></span>
      <div class="banner-text">
        <strong id="banner-title"></strong>
        <p id="banner-detail"></p>
        <div id="banner-score" class="banner-score" aria-label="Completed score; lower is better" hidden>
          <span class="banner-score-hint">COMPLETED · LOWER IS BETTER</span>
          <span class="banner-score-measure"><small>PARTS</small><output id="banner-score-parts"></output><em id="banner-best-parts" hidden>◆ NEW BEST</em></span>
          <span class="banner-score-measure"><small>WIRE</small><output id="banner-score-wire"></output><em id="banner-best-wire" hidden>◆ NEW BEST</em></span>
          <span class="banner-score-measure"><small>TIME</small><output id="banner-score-time"></output><em id="banner-best-time" hidden>◆ NEW BEST</em></span>
        </div>
      </div>
      <button id="banner-next" type="button" hidden>Next →</button>
      <button id="banner-close" type="button" aria-label="Close">×</button>
    </div>

    <main class="app-shell">
      <aside class="briefing-panel" aria-label="Commission and walkthrough">
        <section class="commission" data-region="commission" aria-label="The commission">
          <div class="commission-heading">
            <span>THE COMMISSION</span>
          </div>
          <div id="commission-title" class="commission-title"></div>
          <div id="case-tabs" class="case-tabs"></div>
          <div class="score-readout" aria-label="Current score">
            <span class="score-hint">CURRENT</span>
            <span class="score-measure"><small>PARTS</small><output id="score-parts">0</output></span>
            <span class="score-measure"><small>WIRE</small><output id="score-wire">0</output></span>
            <span class="score-measure"><small>TIME</small><output id="score-time">n/a</output></span>
          </div>
          <div class="score-readout personal-best" aria-label="Independent personal best scores">
            <span class="score-hint">PERSONAL BEST · EACH AXIS</span>
            <span class="score-measure"><small>PARTS</small><output id="best-parts">n/a</output></span>
            <span class="score-measure"><small>WIRE</small><output id="best-wire">n/a</output></span>
            <span class="score-measure"><small>TIME</small><output id="best-time">n/a</output></span>
          </div>
        </section>

        <section id="walkthrough-panel" class="walkthrough" data-region="walkthrough" aria-label="Walkthrough">
          <div class="deck-heading">
            <span>WALKTHROUGH</span>
            <button id="deck-toggle" type="button">hide</button>
          </div>
          <div id="deck-body">
            <div id="deck-step"></div>
            <div class="deck-nav">
              <button id="deck-prev" type="button">‹ back</button>
              <span id="deck-counter"></span>
              <button id="deck-next" type="button">next ›</button>
            </div>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <div class="board-shell" data-region="board">
          <div class="board-toolbar">
            <div class="board-history" aria-label="Edit history">
              <button id="undo-edit" type="button" title="Undo edit (Z or Ctrl/Cmd+Z)" aria-label="Undo edit">↶ <span>Undo</span></button>
              <button id="redo-edit" type="button" title="Redo edit (Shift+Z, Y, or Ctrl/Cmd+Shift+Z)" aria-label="Redo edit">↷ <span>Redo</span></button>
            </div>
            <div class="board-zoom" aria-label="Board zoom controls">
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <span id="zoom-label" aria-live="polite">100%</span>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button id="zoom-fit" type="button" aria-label="Fit board">fit</button>
            </div>
          </div>
          <div id="board-scroll" class="board-scroll">
            <svg id="board" role="img" tabindex="0" aria-label="Wolf Tone board"></svg>
          </div>
          <div id="interaction-status" class="interaction-status" role="status" aria-live="polite" hidden></div>
          <section id="context-editor" class="context-editor" aria-label="Selected part settings" hidden></section>
        </div>

        <div class="transport" data-region="transport">
          <div class="transport-primary">
            <button id="run-button" class="run-button" type="button">▶ Run</button>
            <button id="step-button" type="button">Step</button>
            <button id="reset-run" type="button" aria-label="Reset run">Reset</button>
          </div>
          <div class="tick-readout">
            <small>TICK</small>
            <output id="tick-output">–</output>
            <small id="run-status">READY</small>
          </div>
          <div class="transport-secondary">
            <span class="bar-label">SPEED</span>
            <button data-speed="0" type="button" class="active">1</button>
            <button data-speed="1" type="button">2</button>
            <button data-speed="2" type="button">3</button>
            <span class="transport-divider" aria-hidden="true"></span>
            <button id="clear-machine" class="danger" type="button" aria-label="Clear machine">Clear</button>
          </div>
        </div>
      </section>

      <aside class="tools-panel" aria-label="Parts and inspector">
        <div class="construction-bar" data-region="palette">
          <span class="bar-label">PARTS</span>
          <div id="palette" class="palette"></div>
          <span id="construction-help" class="construction-help"></span>
        </div>

        <section class="inspector-panel" data-region="inspector">
          <div class="panel-heading"><span>INSPECTOR</span><span id="selection-kind">BOARD</span></div>
          <div id="inspector"></div>
          <details class="trace-panel" hidden>
            <summary>RUN TRACE <span id="trace-count">0 events</span></summary>
            <ul id="event-log" class="event-log"></ul>
          </details>
        </section>
      </aside>
    </main>

    <script type="module" src="./main.mjs?v=0.8.8-1"></script>
  </body>
</html>
