name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore Pangram analysis cache
        uses: actions/cache@v4
        with:
          path: .cache/pangram
          key: pangram-default-v1-${{ runner.os }}-${{ hashFiles('posts/*.md', 'pangram_badge.py') }}
          restore-keys: |
            pangram-default-v1-${{ runner.os }}-
      
      - name: Build site
        run: python build.py
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
          PANGRAM_CACHE_PATH: .cache/pangram/results.json
          PANGRAM_MODEL: default
          PANGRAM_REQUIRED: "true"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
