name: Scan posts with Pangram 4

on:
  workflow_dispatch:
    inputs:
      post:
        description: Post path to scan (leave blank for all posts)
        type: string
        default: ''
      refresh:
        description: Rescan existing Pangram 4 results (uses additional credits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pangram-scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scan posts
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
          PANGRAM_POST_PATH: ${{ inputs.post }}
          PANGRAM_REFRESH: ${{ inputs.refresh }}
        run: |
          args=()
          if [ "$PANGRAM_REFRESH" = "true" ]; then
            args+=(--refresh)
          fi
          if [ -n "$PANGRAM_POST_PATH" ]; then
            args+=("$PANGRAM_POST_PATH")
          fi
          python scan_pangram.py --model pangram-4 "${args[@]}"
      - name: Save results and pending tasks for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pangram-results
          path: data/pangram/results.json
          if-no-files-found: error
