<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    {{metadata}}
    <link rel="stylesheet" href="{{stylesheet}}">
    <link rel="alternate" type="application/atom+xml" title="{{site_name}}" href="/feed.xml">
    <script src="{{theme_script}}"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="{{umami_website_id}}"></script>
    <script type="module" src="{{presence_script}}"></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div class="layout">
    <!-- Representative IndieWeb h-card. Keep the canonical identity URL. -->
    <header class="site-header h-card">
        <div class="brand-row">
            <a class="site-name p-name u-url u-uid" href="{{hostname}}/">{{bio.name}}</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
                <span id="theme-icon" aria-hidden="true">🌙</span>
            </button>
        </div>
        <nav class="main-nav" aria-label="Main navigation">{{nav}}</nav>
        <p class="p-note">{{bio.bio}}</p>
        <div class="social-links">
            <a href="{{bio.social.x.url}}" class="social-link" target="_blank" rel="noopener noreferrer"><img src="{{bio.social.x.icon}}" alt="X" class="social-icon" width="24" height="24"></a>
            <a href="{{bio.social.linkedin.url}}" class="social-link" target="_blank" rel="noopener noreferrer"><img src="{{bio.social.linkedin.icon}}" alt="LinkedIn" class="social-icon" width="24" height="24"></a>
            <a href="{{bio.social.github.url}}" class="social-link" target="_blank" rel="me noopener noreferrer"><img src="{{bio.social.github.icon}}" alt="GitHub" class="social-icon" width="24" height="24"></a>
            <a href="{{bio.social.rss.url}}" class="social-link"><img src="{{bio.social.rss.icon}}" alt="RSS" class="social-icon" width="24" height="24"></a>
        </div>
    </header>
    <div class="main-content">
        <main id="content" tabindex="-1">
            {{main_heading}}
            {{content}}
        </main>
        <footer>
            <p>© {{year}} {{site_name}}</p>
            <!-- The ring identifies this site by Referer. Do not add noreferrer. -->
            <nav class="webring" aria-label="IndieWeb Webring">
                <a href="https://xn--sr8hvo.ws/previous" aria-label="Previous site in the ring">←</a>
                An <a href="https://xn--sr8hvo.ws">IndieWeb Webring</a> 🕸️💍
                <a href="https://xn--sr8hvo.ws/next" aria-label="Next site in the ring">→</a>
            </nav>
            <div id="townsquare-root"></div>
            <button id="townsquare-retry" type="button" hidden>Load community widget</button>
        </footer>
    </div>
</div>
</body>
</html>
